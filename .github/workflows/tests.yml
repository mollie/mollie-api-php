name: tests

on:
  push:
    paths:
      - "**.php"
      - ".github/workflows/tests.yml"
      - "phpunit.xml"
      - "composer.json"
      - "composer.lock"
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5", "8.6"]
        stability: [prefer-lowest, prefer-stable]
        guzzle: ["^7.6", "^8.0"]

    name: PHP - ${{ matrix.php }} (Guzzle ${{ matrix.guzzle }}, ${{ matrix.stability }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction
          composer update --prefer-dist --${{ matrix.stability }} --no-interaction --no-progress

      - name: List Installed Dependencies
        run: |
          php --version
          composer show -D

      - name: Verify HasCurrencyConvenienceMethods is up to date
        run: composer check:currency-trait

      - name: Execute tests
        run: ./vendor/bin/pest --parallel

      - name: Analyze both Guzzle majors
        if: matrix.php == '8.4' && matrix.stability == 'prefer-stable'
        run: vendor/bin/phpstan --no-progress
