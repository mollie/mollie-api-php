name: "Update Changelog"

on:
  release:
    types: [published]

jobs:
  update:
    # Release events use the workflow on the tag. Keep v3 tags on the v3 line.
    if: startsWith(github.event.release.tag_name, 'v3.')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Check for an existing release entry
        id: changelog_entry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if grep -Fq "## [$RELEASE_TAG](" CHANGELOG.md; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Changelog
        if: steps.changelog_entry.outputs.exists != 'true'
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}

      - name: Commit updated CHANGELOG
        if: steps.changelog_entry.outputs.exists != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: v3
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
