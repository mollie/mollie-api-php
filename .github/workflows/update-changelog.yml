name: "Update Changelog"

on:
  # `published` fires for stable releases AND pre-releases, including
  # pre-releases published from a draft. `prereleased` does not fire in the
  # draft case, and `released` never fires for pre-releases at all.
  release:
    types: [published]

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check for an existing release entry
        id: changelog_entry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if grep -Fq "## [$RELEASE_TAG](" CHANGELOG.md; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Changelog
        if: steps.changelog_entry.outputs.exists != 'true'
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}

      - name: Commit updated CHANGELOG
        if: steps.changelog_entry.outputs.exists != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
